# Site configuration (Tufte-style theme, written for this site; no external theme).
# The layouts live in /layouts, the stylesheets in /static/css.

baseURL: https://matthijsmaas.com/   # Netlify overrides this with the live address
title: Matthijs Maas
languageCode: en-gb
enableRobotsTXT: true
removePathAccents: true

# No tag, category or author pages.
disableKinds: [taxonomy, term]

# Talks keep their existing addresses (/talk/<title>/).
permalinks:
  event: /talk/:slug/

ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]

markup:
  goldmark:
    renderer:
      unsafe: true   # allows the margin-note shortcodes and HTML in abstracts

imaging:
  resampleFilter: lanczos
  quality: 82

params:
  description: Matthijs Maas is a Senior Research Fellow at the Institute for Law & AI, working on the global governance of AI, its effects on international law, and international catastrophe law.
  role: Senior Research Fellow
  organisation: Institute for Law & AI
  organisation_url: https://law-ai.org/
  email: mmm71@cantab.ac.uk
  cv: uploads/Academic CV - Matthijs Maas - Sep 2025.pdf
  blog: https://criticalmaas.substack.com/
  portrait: img/portrait.jpg
